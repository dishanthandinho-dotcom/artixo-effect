[package]
name = "artixo-effect-gpu"
description = "The GPU compositor (wgpu compute): layer transforms, masks/mattes, the 38 blend modes, motion blur, bit-depth quantisation and GPU effects, with the CPU renderer as the reference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
artixo-effect-time = { workspace = true }
artixo-effect-geom = { workspace = true }
artixo-effect-color = { workspace = true }
artixo-effect-project = { workspace = true }
artixo-effect-raster = { workspace = true }
artixo-effect-effects = { workspace = true }
artixo-effect-render = { workspace = true }
artixo-effect-keyframe = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

[dev-dependencies]
artixo-effect-text = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
