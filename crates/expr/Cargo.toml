[package]
name = "artixo-effect-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
artixo-effect-time = { workspace = true }
artixo-effect-geom = { workspace = true }
artixo-effect-keyframe = { workspace = true }
serde_json = { workspace = true }
artixo-effect-project = { workspace = true }
artixo-effect-path = { workspace = true }
artixo-effect-render = { workspace = true }
boa_engine = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
artixo-effect-color = { workspace = true }
artixo-effect-effects = { workspace = true }
artixo-effect-text = { workspace = true }
