name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev libgtk-3-dev
      - run: cargo check --workspace --locked
      - run: cargo test --locked -p artixo-effect-engine -p artixo-effect-ui-egui --lib
